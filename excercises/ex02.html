<!DOCTYPE html>
<html>
<head>
    <title>DragonStorm_By_Gabriel_Whitten</title>
    <link href="ex02.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <div class="container">
        
        <h1> WELCOME TO <span class="title-highlight">DRAGONSTORM!</span> </h1>
        
        <p>This game is going to feature multiple kinds of minigames involving <span class="dragon-highlight">DRAGONS!</span> </p>
        
        <div class="menu-block">
            <h2> Choose Single or Two player </h2>
            
            <div class="selection-container">
                <label class="option-block">
                    <input type="radio" name="mode"> <span class="mode-text">Single Player</span>
                </label>
                <label class="option-block">
                    <input type="radio" name="mode"> <span class="mode-text">Two Player</span>
                </label>
            </div>
            
            <h3> SINGLE PLAYER GAMES </h3>
            <ul>
                <li><span class="game-title">Dragon VS Goblins</span></li>
                <li><span class="game-title">Dragon Gold Collector</span></li>
                <li><span class="game-title">Dragon Table Tennis</span></li>
                <li><span class="game-title">Dragon Breakout</span></li>
            </ul>

            <h3> TWO PLAYER GAMES </h3>
            <ul>
                <li><span class="game-title">Dragon Storm</span> (Battle Royal)</li>
            </ul>
        </div>

    </div>

</body>
</html>
